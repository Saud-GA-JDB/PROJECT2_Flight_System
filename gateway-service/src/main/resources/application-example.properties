spring.application.name=gateway-service
server.port=${SERVER_PORT:8085}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=30s

# Identity
spring.cloud.gateway.server.webflux.routes[0].id=identity
spring.cloud.gateway.server.webflux.routes[0].uri=${IDENTITY_BASE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/users/**

# Maintenance: match these before Aviation's broader admin paths.
spring.cloud.gateway.server.webflux.routes[1].id=maintenance
spring.cloud.gateway.server.webflux.routes[1].order=-1
spring.cloud.gateway.server.webflux.routes[1].uri=${MAINTENANCE_BASE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=\
    /maintenanceAdmin/**,\
    /maintenanceTechnician/**,\
    /faaadmin/maintenanceProviders/**,\
    /airlineAdmin/maintenanceProviders/**,\
    /airlineAdmin/maintenanceRequests/**,\
    /airlineAdmin/airplanes/*/maintenanceRequests,\
    /airlineAdmin/airplanes/*/maintenanceRecords

# Live notifications
spring.cloud.gateway.server.webflux.routes[2].id=notification
spring.cloud.gateway.server.webflux.routes[2].uri=${NOTIFICATION_BASE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/notifications
spring.cloud.gateway.server.webflux.routes[2].metadata.response-timeout=-1

# Aviation
spring.cloud.gateway.server.webflux.routes[3].id=aviation
spring.cloud.gateway.server.webflux.routes[3].uri=${AVIATION_BASE_URL:http://localhost:8080}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=\
    /flights/**,\
    /bookings/**,\
    /customer/**,\
    /payments/**,\
    /faaadmin/**,\
    /airlineAdmin/**,\
    /airportAdmin/**,\
    /airportInspector/**,\
    /pilot/**,\
    /atc/**,\
    /atcAdmin/**
