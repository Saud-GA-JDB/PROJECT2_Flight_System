spring.application.name=notification-service
server.port=8084
server.error.include-stacktrace=NEVER

notification.service-key=${NOTIFICATION_SERVICE_KEY:}

identity.base-url=${IDENTITY_BASE_URL:http://localhost:8081}
identity.service-key=${IDENTITY_SERVICE_KEY}
spring.cloud.openfeign.client.config.identity.connectTimeout=2000
spring.cloud.openfeign.client.config.identity.readTimeout=5000
spring.cloud.openfeign.client.config.identity.loggerLevel=none

# SMTP belongs only to Notification. Bound SMTP socket waits; callers use a 15-second read timeout.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
