spring.application.name=notification-service
server.port=8084
server.error.include-stacktrace=NEVER

notification.service-key=${NOTIFICATION_SERVICE_KEY:}

identity.base-url=${IDENTITY_BASE_URL:http://localhost:8081}
identity.service-key=${IDENTITY_SERVICE_KEY}
spring.cloud.openfeign.client.config.identity.connectTimeout=2000
spring.cloud.openfeign.client.config.identity.readTimeout=5000
spring.cloud.openfeign.client.config.identity.loggerLevel=none
