spring.application.name=maintenance-service
server.port=8083
server.error.include-stacktrace=NEVER

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aviation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

aviation.base-url=http://localhost:8080
spring.cloud.openfeign.client.config.aviation.connectTimeout=2000
spring.cloud.openfeign.client.config.aviation.readTimeout=5000
spring.cloud.openfeign.client.config.aviation.loggerLevel=none
