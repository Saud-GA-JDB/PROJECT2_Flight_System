spring.application.name=maintenance-service
server.port=8083
server.error.include-stacktrace=NEVER

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aviation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.seed.enabled=false
# Optional seeding: existing airplane and its airline admin's full Bearer header.
app.seed.airplane-id=${MAINTENANCE_SEED_AIRPLANE_ID:0}
app.seed.authorization=${MAINTENANCE_SEED_AUTHORIZATION:}

maintenance.notification-service-key=${MAINTENANCE_NOTIFICATION_SERVICE_KEY:}

aviation.base-url=http://localhost:8080
spring.cloud.openfeign.client.config.aviation.connectTimeout=2000
spring.cloud.openfeign.client.config.aviation.readTimeout=5000
spring.cloud.openfeign.client.config.aviation.loggerLevel=none

identity.base-url=http://localhost:8081
identity.service-key=${IDENTITY_SERVICE_KEY}
spring.cloud.openfeign.client.config.identity.connectTimeout=2000
spring.cloud.openfeign.client.config.identity.readTimeout=5000
spring.cloud.openfeign.client.config.identity.loggerLevel=none
