spring.application.name=identity-service
server.port=8081
server.error.include-stacktrace=never
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aviation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
jwt-secret=${JWT_SECRET}
jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}
identity.service-key=${IDENTITY_SERVICE_KEY}
app.seed.enabled=${APP_SEED_ENABLED:false}

notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8084}
notification.service-key=${NOTIFICATION_SERVICE_KEY:}
spring.cloud.openfeign.client.config.notification.connectTimeout=2000
spring.cloud.openfeign.client.config.notification.readTimeout=15000
spring.cloud.openfeign.client.config.notification.loggerLevel=none
