spring.application.name=saudsFlightSystem
server.port=${SERVER_PORT:8080}
server.error.include-stacktrace=NEVER
app.seed.enabled=${APP_SEED_ENABLED:false}
maintenance.notification-service-key=${MAINTENANCE_NOTIFICATION_SERVICE_KEY:}
notification.base-url=${NOTIFICATION_BASE_URL:http://localhost:8084}
notification.service-key=${NOTIFICATION_SERVICE_KEY:}
spring.cloud.openfeign.client.config.notification.connectTimeout=2000
spring.cloud.openfeign.client.config.notification.readTimeout=15000
spring.cloud.openfeign.client.config.notification.loggerLevel=none
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aviation}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.success-url=${STRIPE_SUCCESS_URL}
stripe.cancel-url=${STRIPE_CANCEL_URL}

identity.base-url=${IDENTITY_BASE_URL:http://localhost:8081}
identity.service-key=${IDENTITY_SERVICE_KEY}
spring.cloud.openfeign.client.config.identity.connectTimeout=2000
spring.cloud.openfeign.client.config.identity.readTimeout=5000
spring.cloud.openfeign.client.config.identity.loggerLevel=none

# Kafka connection (host default; override for Docker containers).
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.bootstrap-servers=${kafka.bootstrap-servers}

# Aviation publishes JSON strings to Kafka.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[max.block.ms]=2000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.producer.properties[delivery.timeout.ms]=30000
